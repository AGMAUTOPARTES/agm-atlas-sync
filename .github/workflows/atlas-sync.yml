name: Atlas - Sincronizacao Bling em nuvem

# Disparado exclusivamente pelo botao do Atlas ("Atualizar agora" /
# "Atualizar por período/módulos"), via chamada de API do GitHub feita pelo
# Worker (workflow_dispatch com o job_id, os modulos e o periodo
# escolhidos) -- e' assim que o clique funciona de qualquer
# computador/celular, sem depender de nenhuma maquina ligada.
#
# O cron automatico (rodava sozinho de 4 em 4 horas) foi DESLIGADO em
# 10/09/2026 a pedido do Jonas: ele estava perto de estourar a cota
# gratuita de minutos do GitHub Actions porque cada run fazia sync
# completo do catalogo inteiro, sempre. Agora e' 100% sob demanda, e da
# pra escolher so os modulos que interessam (ver input "modules" abaixo).
# Pra reativar o cron automatico, descomente o bloco "schedule:".
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID do job criado pelo Atlas (deixe em branco pra testar manualmente)"
        required: false
        default: ""
      modules:
        description: "Modulos a sincronizar, separados por virgula (vazio = todos). Opcoes: categorias,situacoes,produtos,estoques_depositos,contatos,pedidos_venda,notas_entrada,pedidos_compra"
        required: false
        default: ""
      period_start:
        description: "Data inicial AAAA-MM-DD (so afeta pedidos_venda/notas_entrada; vazio = ultimos 120 dias)"
        required: false
        default: ""
      period_end:
        description: "Data final AAAA-MM-DD (so afeta pedidos_venda/notas_entrada; vazio = hoje)"
        required: false
        default: ""
  # schedule:
  #   - cron: "0 */4 * * *"

concurrency:
  group: atlas-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Rodar sincronizacao Bling -> Atlas
        env:
          BLING_CLIENT_ID: ${{ secrets.BLING_CLIENT_ID }}
          BLING_CLIENT_SECRET: ${{ secrets.BLING_CLIENT_SECRET }}
          BLING_BASE_URL: ${{ secrets.BLING_BASE_URL }}
          AGM_SITE_SYNC_KEY: ${{ secrets.AGM_SITE_SYNC_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          AGM_SITE_URL: ${{ secrets.AGM_SITE_URL }}
          TOKEN_STORE: cloud
          JOB_ID: ${{ github.event.inputs.job_id }}
          MODULES: ${{ github.event.inputs.modules }}
          PERIOD_START: ${{ github.event.inputs.period_start }}
          PERIOD_END: ${{ github.event.inputs.period_end }}
        run: python run_cloud_sync.py
